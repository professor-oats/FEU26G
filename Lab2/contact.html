<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="description" content="Contact page of Actress Julie Bennet">
  <link rel="stylesheet" href="css/julie/julie.css">
  <title>Contact Julie Bennet</title>
</head>
<body>
  <section id="contact-content">
    <h1>Let's Create Something Beautiful</h1>
    <p>
      Have an idea, a project, or an opportunity
      you'd like to discuss?
    </p>
    <p>
      I'd love to hear from you.
    </p>
    <form id="contact-form" action="#" method="POST">
      <div>
        <label for="name">Your Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="What should I call you?"
          required
        >
      </div>
      <div>
        <label for="email">Your Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Where can I reach you?"
          required
        >
      </div>
      <div>
        <label for="subject">What is this about?</label>
        <input
          type="text"
          id="subject"
          name="subject"
          placeholder="A project, opportunity, or idea"
          required
        >
      </div>
      <div>
        <label for="message">Tell me more</label>
        <textarea
          id="message"
          name="message"
          placeholder="I'd love to hear what's on your mind"
          required
        ></textarea>
      </div>
      <button type="submit">
        Send Your Message
      </button>
    </form>
    <a id="back-link" href="index.html">&lt;... Back to main site</a>
  </section>
</body>
</html>
