<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="styles.css">
  <title>Website Builder</title>
  <script src="script.js" defer></script>
</head>
<body>
  <div id="toolbar">
    <label for="editor-mode">Editor mode</label>
    <select id="editor-mode">
      <option value="place" selected>Place elements</option>
      <option value="move">Move elements</option>
      <option value="paragraph">Paragraph</option>
      <option value="edit">Edit elements</option>
    </select>
    <label for="font-family">Font family</label>
    <select id="font-family">
      <option value="Arial" selected>Arial</option>
      <option value="Georgia">Georgia</option>
      <option value="Verdana">Verdana</option>
      <option value="Times New Roman">Times New Roman</option>
      <option value="Trebuchet MS">Trebuchet MS</option>
      <option value="Courier New">Courier New</option>
    </select>
    <label for="paragraph-font-size">Font size</label>
    <select id="paragraph-font-size">
      <option value="12">12 px</option>
      <option value="14">14 px</option>
      <option value="16" selected>16 px</option>
      <option value="18">18 px</option>
      <option value="24">24 px</option>
      <option value="32">32 px</option>
      <option value="40">40 px</option>
    </select>
    <div id="padding-controls" hidden>
      <h3>Paragraph Padding</h3>

      <div class="padding-control-row">
        <label for="padding-x">Horizontal (X):</label>
        <input
          type="range"
          id="padding-x"
          min="0"
          max="100"
          step="1"
          value="10"
        >
        <output id="padding-x-value" for="padding-x">10 px</output>
      </div>

      <div class="padding-control-row">
        <label for="padding-y">Vertical (Y):</label>
        <input
          type="range"
          id="padding-y"
          min="0"
          max="100"
          step="1"
          value="8"
        >
        <output id="padding-y-value" for="padding-y">8 px</output>
      </div>

      <label for="padding-css">CSS padding:</label>
      <textarea
        id="padding-css"
        rows="2"
        spellcheck="false"
      >padding: 8px 10px;</textarea>

      <button id="apply-padding-css" type="button">Apply CSS</button>
      <span id="padding-css-error" role="status" aria-live="polite"></span>
    </div>
    <label for="element-type">Element:</label>
    <select id="element-type">
      <option value="header">Header</option>
      <option value="text" disabled>Text block (coming soon)</option>
      <option value="image" disabled>Image (coming soon)</option>
      <option value="button" disabled>Button (coming soon)</option>
    </select>
    <div class="color-target-toggle">
      <label>
        <input
          type="radio"
          name="colorTarget"
          value="color"
          checked
        />
        Color
      </label>

      <label>
        <input
          type="radio"
          name="colorTarget"
          value="background"
        />
        Background
      </label>
    </div>
    <button type="button" id="clearBackgroundButton">
      Transparent background
    </button>
    <label for="background-type">Color:</label>
    <select id="background-type">
      <option value="solid">Solid color</option>
      <option value="gradient">Gradient</option>
    </select>
    <div id="solid-controls">
      <label for="color-picker"></label>
      <input type="color" id="color-picker" value="#3366ff">
    </div>

    <div id="gradient-controls" hidden>
      <label for="gradient-start">From:</label>
      <input type="color" id="gradient-start" value="#3366ff">

      <label for="gradient-end">To:</label>
      <input type="color" id="gradient-end" value="#ff66aa">

      <label for="gradient-direction">Direction:</label>
      <select id="gradient-direction">
        <option value="to right">Left to right</option>
        <option value="to left">Right to left</option>
        <option value="to bottom">Top to bottom</option>
        <option value="to top">Bottom to top</option>
        <option value="to bottom right">Diagonal</option>
        <option value="to bottom left">Reverse diagonal</option>
      </select>
    </div>
    <button id="save-project">Save Version</button>

    <select id="saved-versions">
      <option value="">Choose a saved version</option>
    </select>

    <button id="restore-project">Restore Version</button>
    <button id="toggle-smart-guides" type="button" aria-pressed="true">
      Smart Guides: On
    </button>
  </div>
  <main id="website-canvas">
    <div id="ghost-block" class="ghost-block"></div>
    <div id="selection-overlay" hidden></div>
  </main>
</body>
</html>
